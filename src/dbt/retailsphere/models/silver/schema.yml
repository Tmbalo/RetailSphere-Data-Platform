version: 2

models:
  - name: stg_sales
    description: "Cleaned sales lines, one row per order line item."
    columns:
      - name: order_id
        description: "Business transaction identifier from the POS."
        tests: [not_null]
      - name: line_number
        description: "Line position within the order, starting at 1."
        tests: [not_null]
      - name: sale_date
        description: "Calendar date the sale occurred."
        tests: [not_null]
      - name: sales_value
        description: "Quantity multiplied by unit price, before discounts."
      - name: store_id
        description: "Identifier of the store where the sale took place."
      - name: product_id
        description: "Identifier of the product sold on this line."
      - name: quantity
        description: "Number of units sold on this line."
      - name: unit_price
        description: "Selling price per unit at the time of sale."
  - name: stg_pos_sales
    description: "Silver POS sales lines: renamed, typed and enriched from Bronze. One row per order line."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - line_number
    columns:
      - name: order_id
        description: "POS transaction identifier; groups the lines of one receipt."
        tests: [not_null]
      - name: line_number
        description: "Line position within the order, starting at 1."
        tests: [not_null]
      - name: sales_timestamp
        description: "Date and time the sale was rung up."
        tests: [not_null]
      - name: sales_date
        description: "Calendar date of the sale, used to look up the date key in Gold."
        tests: [not_null]
      - name: store_id
        description: "POS identifier of the store where the sale happened."
        tests: [not_null]
      - name: pos_barcode
        description: "Product barcode scanned at the till."
        tests: [not_null]
      - name: customer_id
        description: "Loyalty customer identifier; null for anonymous sales."
      - name: is_anonymous
        description: "True when no customer identity was captured; Gold maps these to customer_key 0."
        tests: [not_null]
      - name: quantity
        description: "Number of units sold on this line."
        tests: [not_null]
      - name: unit_price
        description: "Selling price per unit at the time of sale, before discount."
        tests: [not_null]
      - name: discount_amount
        description: "Discount applied to this line; zero when no discount."
        tests: [not_null]
      - name: sales_value
        description: "Quantity multiplied by unit price, before discount."
      - name: discount_pct
        description: "Discount as a percentage of the line's gross value (quantity x unit price)."
      - name: source_system_code
        description: "Source system of the row; 1 = Oracle MICROS POS."